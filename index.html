<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="MindSprint - Brain Training Games">
<title>MindSprint</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#07111f;
  --panel:#0d1b2d;
  --panel2:#12243a;
  --text:#f5f8ff;
  --muted:#8fa4bd;
  --accent:#6ee7ff;
  --green:#58e39b;
  --yellow:#ffd166;
  --red:#ff6b7a;
  --line:#203751;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at top,#132b45 0,#07111f 48%,#040a12 100%);
  color:var(--text);
  min-height:100vh;
}
button{
  font:inherit;
  color:inherit;
  border:0;
  cursor:pointer;
}
.app{
  width:min(720px,100%);
  margin:auto;
  min-height:100vh;
  padding:18px 14px 40px;
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}
.logo{
  font-size:25px;
  font-weight:900;
}
.logo span{color:var(--accent)}
.headerSmall{
  color:var(--muted);
  font-size:12px;
}
.screen{display:none}
.screen.active{display:block}
.hero{
  background:linear-gradient(145deg,#10263d,#0b1728);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 14px 40px #0004;
}
.hero h1{
  margin:0 0 8px;
  font-size:30px;
}
.hero p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
}
.gameGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.gameCard{
  background:linear-gradient(145deg,#10243a,#0b1728);
  border:1px solid var(--line);
  border-radius:20px;
  padding:17px;
  min-height:180px;
  text-align:left;
  transition:.18s;
}
.gameCard:active{transform:scale(.97)}
.gameIcon{
  width:54px;
  height:54px;
  display:grid;
  place-items:center;
  border-radius:16px;
  background:#172f49;
  font-size:28px;
  margin-bottom:12px;
}
.gameCard h3{margin:0 0 7px}
.gameCard p{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.4;
}
.gameTag{
  display:inline-block;
  margin-top:12px;
  font-size:11px;
  color:var(--accent);
}
.topbar{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}
.back{
  background:#14273d;
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px 13px;
}
.titleBox{flex:1}
.titleBox h2{margin:0;font-size:21px}
.titleBox small{color:var(--muted)}
.levelMap{
  background:#091522;
  border:1px solid var(--line);
  border-radius:24px;
  padding:18px 12px;
  margin-top:10px;
}
.mapTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.mapTitle strong{font-size:17px}
.mapTitle span{color:var(--muted);font-size:12px}
.levelList{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}
.levelNode{
  width:100%;
  max-width:350px;
  position:relative;
}
.levelNode button{
  width:100%;
  min-height:68px;
  border-radius:20px;
  padding:10px 15px;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  border:1px solid var(--line);
  background:#10243a;
}
.levelNode.open button{border-color:#2b5575}
.levelNode.done button{
  border-color:#26714f;
  background:#0d2b23;
}
.levelNode.current button{
  border-color:var(--accent);
  box-shadow:0 0 0 2px #6ee7ff22;
}
.levelNode.locked button{
  opacity:.48;
  cursor:not-allowed;
}
.nodeIcon{
  width:44px;
  height:44px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#172f49;
  font-weight:900;
}
.done .nodeIcon{background:#164c38}
.current .nodeIcon{background:#174458}
.nodeText strong{display:block}
.nodeText small{color:var(--muted)}
.connector{
  height:10px;
  width:3px;
  background:#29445d;
}
.mapMore{
  width:100%;
  margin-top:15px;
  background:#122b42;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:15px;
}
.stat{
  background:#0d1b2d;
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px;
  text-align:center;
}
.stat b{display:block;font-size:19px}
.stat small{color:var(--muted)}
.gamePanel{
  position:relative;
  background:#091522;
  border:1px solid var(--line);
  border-radius:24px;
  padding:16px;
  min-height:480px;
  overflow:hidden;
}
.gameHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.gameHeader strong{font-size:17px}
.score{
  color:var(--accent);
  font-weight:900;
}
.message{
  text-align:center;
  color:var(--muted);
  min-height:22px;
  margin:7px 0 14px;
}
.primary{
  background:linear-gradient(135deg,#55ddff,#6ee7ff);
  color:#04111c;
  font-weight:900;
  padding:13px 20px;
  border-radius:14px;
}
.secondary{
  background:#14273d;
  border:1px solid var(--line);
  padding:12px 17px;
  border-radius:14px;
}
.center{
  display:flex;
  justify-content:center;
  align-items:center;
}
.hidden{display:none!important}

/* Memory */
.memoryGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  max-width:470px;
  margin:20px auto;
}
.card{
  aspect-ratio:1;
  border-radius:14px;
  background:#122a43;
  border:1px solid #29445e;
  display:grid;
  place-items:center;
  font-size:26px;
  transition:.2s;
}
.card.open,.card.matched{background:#153c4d}
.card.matched{border-color:var(--green)}

/* Reaction */
.reactionArena{
  height:430px;
  position:relative;
  overflow:hidden;
  border-radius:20px;
  background:linear-gradient(#091725,#06101b);
  border:1px solid #1e3850;
}
.falling{
  position:absolute;
  bottom:-70px;
  display:grid;
  place-items:center;
  font-weight:900;
  user-select:none;
  touch-action:manipulation;
  animation:rise linear forwards;
}
.bubble{
  width:54px;
  height:54px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#fff8,#4bdcff 22%,#2477ff 70%);
  box-shadow:0 0 22px #3acfff55;
}
.bubble.alt{
  background:radial-gradient(circle at 30% 25%,#fff8,#ffcb57 20%,#ff6b35 72%);
}
.bubble.green{
  background:radial-gradient(circle at 30% 25%,#fff8,#67f5b2 20%,#159b67 72%);
}
.number{
  width:50px;
  height:50px;
  border-radius:14px;
  background:#24182c;
  border:2px solid #ff5d82;
  color:#ff7d9a;
  font-size:18px;
}
@keyframes rise{
  to{transform:translateY(-520px) rotate(360deg);opacity:.95}
}

/* Mind Shift */
.shiftBox{
  max-width:520px;
  margin:25px auto;
  text-align:center;
}
.rule{
  background:#122a42;
  border:1px solid #29445d;
  border-radius:18px;
  padding:15px;
  margin-bottom:15px;
}
.rule small{color:var(--muted)}
.rule b{display:block;font-size:25px;margin-top:5px}
.shiftChoices{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.shiftChoice{
  min-height:90px;
  background:#132a42;
  border:1px solid #29445d;
  border-radius:17px;
  font-size:28px;
}
.shiftChoice:active{transform:scale(.96)}

/* Logic */
.logicBox{
  max-width:600px;
  margin:auto;
}
.question{
  font-size:18px;
  line-height:1.5;
  background:#10243a;
  border:1px solid #29445d;
  padding:18px;
  border-radius:18px;
  margin-bottom:12px;
}
.options{
  display:grid;
  gap:9px;
}
.logicOption{
  padding:15px;
  background:#0f2135;
  border:1px solid #29445d;
  border-radius:14px;
  text-align:left;
}
.logicOption:active{transform:scale(.985)}
.explain{
  background:#10283c;
  border:1px solid #2c526d;
  border-radius:15px;
  padding:13px;
  margin-top:13px;
  color:#c5d7e8;
  line-height:1.45;
}

/* Calm */
.calmBox{
  text-align:center;
  max-width:500px;
  margin:auto;
}
.breathCircle{
  width:190px;
  height:190px;
  margin:45px auto 25px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:radial-gradient(circle,#6ee7ff44,#16384c 55%,#0b1728);
  border:2px solid #3e7d96;
  box-shadow:0 0 45px #53dfff22;
}
.breathCircle.animate{animation:breathe 8s ease-in-out infinite}
@keyframes breathe{
  0%,100%{transform:scale(.72)}
  50%{transform:scale(1.12)}
}
.calmText{font-size:22px;font-weight:900}
.calmSub{color:var(--muted);margin-top:8px;line-height:1.5}
.calmButtons{
  display:flex;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap;
  margin-top:20px;
}
.progress{
  height:8px;
  background:#16283b;
  border-radius:10px;
  overflow:hidden;
  margin:12px 0;
}
.progress i{
  display:block;
  height:100%;
  width:0;
  background:var(--accent);
  transition:.3s;
}
.result{
  text-align:center;
  padding:25px 10px;
}
.result h2{font-size:28px}
.resultScore{
  font-size:50px;
  font-weight:900;
  color:var(--accent);
  margin:15px 0;
}
.adSlot{
  display:none;
  min-height:50px;
  margin:15px 0;
  text-align:center;
  color:#60748a;
  font-size:10px;
}
@media(max-width:520px){
  .gameGrid{grid-template-columns:1fr}
  .gameCard{min-height:145px}
  .gamePanel{min-height:500px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">Mind<span>Sprint</span></div>
  <div class="headerSmall">Learn • Play • Remember</div>
</header>

<!-- HOME -->
<section id="home" class="screen active">
  <div class="hero">
    <h1>Train your brain.</h1>
    <p>Play different challenges, clear levels, improve your skills and build your own MindSprint progress.</p>
  </div>

  <div class="gameGrid">

    <button class="gameCard" onclick="openLevels('memory')">
      <div class="gameIcon">🧠</div>
      <h3>Memory Match</h3>
      <p>Remember positions, match pairs and push your memory further.</p>
      <span class="gameTag">MEMORY</span>
    </button>

    <button class="gameCard" onclick="openLevels('reaction')">
      <div class="gameIcon">⚡</div>
      <h3>Quick Reaction</h3>
      <p>Catch the right bubbles while avoiding numbers as everything gets faster.</p>
      <span class="gameTag">SPEED</span>
    </button>

    <button class="gameCard" onclick="openLevels('shift')">
      <div class="gameIcon">🔄</div>
      <h3>Mind Shift</h3>
      <p>Switch rules quickly and train mental flexibility.</p>
      <span class="gameTag">FLEXIBILITY</span>
    </button>

    <button class="gameCard" onclick="openLevels('logic')">
      <div class="gameIcon">🧩</div>
      <h3>Logic Lab</h3>
      <p>Patterns, numbers, reasoning and bilingual brain puzzles.</p>
      <span class="gameTag">LOGIC</span>
    </button>

    <button class="gameCard" onclick="openLevels('calm')">
      <div class="gameIcon">🌿</div>
      <h3>Mind Calm</h3>
      <p>Interactive breathing and focus sessions to reset your mind.</p>
      <span class="gameTag">FOCUS</span>
    </button>

  </div>
</section>

<!-- LEVELS -->
<section id="levels" class="screen">
  <div class="topbar">
    <button class="back" onclick="goHome()">←</button>
    <div class="titleBox">
      <h2 id="levelTitle">Levels</h2>
      <small id="levelSubtitle"></small>
    </div>
  </div>

  <div class="levelMap">
    <div class="mapTitle">
      <strong>Level Path</strong>
      <span id="levelCount"></span>
    </div>
    <div id="levelList" class="levelList"></div>
    <button id="moreLevels" class="mapMore" onclick="showMoreLevels()">Show more levels</button>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="topbar">
    <button class="back" onclick="backToLevels()">←</button>
    <div class="titleBox">
      <h2 id="gameTitle">Game</h2>
      <small id="gameLevel"></small>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="scoreStat">0</b><small>Score</small></div>
    <div class="stat"><b id="levelStat">1</b><small>Level</small></div>
    <div class="stat"><b id="bestStat">0</b><small>Best</small></div>
  </div>

  <div id="gamePanel" class="gamePanel"></div>
</section>

</div>

<script>
/* =========================================================
   MindSprint Final Engine
   ========================================================= */

const GAME_INFO={
  memory:{
    title:"🧠 Memory Match",
    sub:"Remember and match",
  },
  reaction:{
    title:"⚡ Quick Reaction",
    sub:"Bubble vs Number",
  },
  shift:{
    title:"🔄 Mind Shift",
    sub:"Switch the rule",
  },
  logic:{
    title:"🧩 Logic Lab",
    sub:"Reasoning challenge",
  },
  calm:{
    title:"🌿 Mind Calm",
    sub:"Focus and breathe",
  }
};

let currentGame="";
let currentLevel=1;
let visibleLevels=20;
let score=0;
let gameTimer=null;
let gameCleanup=null;

/* ---------- STORAGE ---------- */

function keyUnlocked(g){
  return "mindsprint_unlocked_"+g;
}

function getUnlocked(g){
  return Math.max(1,Number(localStorage.getItem(keyUnlocked(g))||1));
}

function isDone(g,l){
  return localStorage.getItem("mindsprint_done_"+g+"_"+l)==="1";
}

function markDone(g,l){
  localStorage.setItem("mindsprint_done_"+g+"_"+l,"1");
}

function unlockNext(g,l){
  let u=getUnlocked(g);
  if(l>=u){
    localStorage.setItem(keyUnlocked(g),String(l+1));
  }
  markDone(g,l);
}

function bestKey(g,l){
  return "mindsprint_best_"+g+"_"+l;
}

function getBest(g,l){
  return Number(localStorage.getItem(bestKey(g,l))||0);
}

function saveBest(g,l,s){
  if(s>getBest(g,l)){
    localStorage.setItem(bestKey(g,l),String(s));
  }
}

function totalDone(g){
  let u=getUnlocked(g);
  let n=0;
  for(let i=1;i<u;i++){
    if(isDone(g,i)) n++;
  }
  return n;
}

/* ---------- NAVIGATION ---------- */

function show(id){
  document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function goHome(){
  stopGame();
  show("home");
}

function openLevels(g){
  currentGame=g;
  visibleLevels=20;
  document.getElementById("levelTitle").textContent=GAME_INFO[g].title;
  document.getElementById("levelSubtitle").textContent=GAME_INFO[g].sub;
  renderLevels();
  show("levels");
}

function renderLevels(){
  const list=document.getElementById("levelList");
  const unlocked=getUnlocked(currentGame);
  const max=Math.min(10000,visibleLevels);

  list.innerHTML="";

  for(let l=1;l<=max;l++){
    const node=document.createElement("div");
    node.className="levelNode";

    const locked=l>unlocked;
    const done=isDone(currentGame,l);
    const current=l===unlocked;

    if(locked) node.classList.add("locked");
    else node.classList.add("open");
    if(done) node.classList.add("done");
    if(current) node.classList.add("current");

    const btn=document.createElement("button");

    if(locked){
      btn.disabled=true;
    }else{
      btn.onclick=()=>startGame(currentGame,l);
    }

    let icon="🔓";
    if(locked) icon="🔒";
    if(done) icon="✓";
    if(current) icon="▶";

    btn.innerHTML=
      '<div class="nodeIcon">'+icon+'</div>'+
      '<div class="nodeText">'+
      '<strong>Level '+l+'</strong>'+
      '<small>'+
      (done?"Completed • Replay anytime":
       current?"Current level • Play now":
       "Unlocked • Replay anytime")+
      '</small></div>';

    node.appendChild(btn);
    list.appendChild(node);

    if(l<max){
      const c=document.createElement("div");
      c.className="connector";
      list.appendChild(c);
    }
  }

  document.getElementById("levelCount").textContent=
    "Unlocked: "+unlocked+" • Done: "+totalDone(currentGame);

  document.getElementById("moreLevels").style.display=
    visibleLevels<10000?"block":"none";
}

function showMoreLevels(){
  visibleLevels=Math.min(10000,visibleLevels+20);
  renderLevels();
}

function backToLevels(){
  stopGame();
  openLevels(currentGame);
}

/* ---------- GAME START ---------- */

function startGame(g,l){
  stopGame();

  currentGame=g;
  currentLevel=l;
  score=0;

  document.getElementById("gameTitle").textContent=GAME_INFO[g].title;
  document.getElementById("gameLevel").textContent="Level "+l;
  document.getElementById("levelStat").textContent=l;
  document.getElementById("bestStat").textContent=getBest(g,l);
  document.getElementById("scoreStat").textContent="0";

  show("game");

  if(g==="memory") initMemory(l);
  if(g==="reaction") initReaction(l);
  if(g==="shift") initShift(l);
  if(g==="logic") initLogic(l);
  if(g==="calm") initCalm(l);
}

function stopGame(){
  if(gameTimer){
    clearInterval(gameTimer);
    gameTimer=null;
  }

  if(gameCleanup){
    try{gameCleanup()}catch(e){}
    gameCleanup=null;
  }
}

/* ---------- COMMON ---------- */

function setScore(v){
  score=v;
  document.getElementById("scoreStat").textContent=v;
}

function addScore(v){
  setScore(Math.max(0,score+v));
}

function finishGame(finalScore=score){
  stopGame();

  saveBest(currentGame,currentLevel,finalScore);
  unlockNext(currentGame,currentLevel);

  const panel=document.getElementById("gamePanel");

  panel.innerHTML=
    '<div class="result">'+
    '<div style="font-size:50px">🏆</div>'+
    '<h2>Level Complete!</h2>'+
    '<p style="color:var(--muted)">Level '+currentLevel+' cleared successfully.</p>'+
    '<div class="resultScore">'+finalScore+'</div>'+
    '<p>Score</p>'+
    '<div style="margin-top:20px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap">'+
    '<button class="secondary" onclick="backToLevels()">Level Map</button>'+
    '<button class="primary" onclick="startGame(currentGame,currentLevel)">Replay</button>'+
    '<button class="secondary" onclick="startGame(currentGame,currentLevel+1)">Next Level →</button>'+
    '</div>'+
    '</div>';

  document.getElementById("bestStat").textContent=getBest(currentGame,currentLevel);
}

/* =========================================================
   MEMORY MATCH
   ========================================================= */

function initMemory(level){
  const panel=document.getElementById("gamePanel");

  const pairs=Math.min(10,4+Math.floor((level-1)/2));
  const symbols=["🍎","🚀","🧠","⭐","🎯","🌙","🔥","🍀","⚡","🎵"];
  const selected=symbols.slice(0,pairs);

  let cards=[...selected,...selected];
  cards.sort(()=>Math.random()-.5);

  let first=null;
  let second=null;
  let lock=false;
  let matched=0;
  let moves=0;

  panel.innerHTML=
    '<div class="gameHeader">'+
    '<strong>Remember the pairs</strong>'+
    '<span class="score">Pairs: <b id="pairCount">0</b>/'+pairs+'</span>'+
    '</div>'+
    '<div class="message">Find every matching pair.</div>'+
    '<div class="memoryGrid" id="memoryGrid"></div>';

  const grid=document.getElementById("memoryGrid");

  cards.forEach((symbol,i)=>{
    const card=document.createElement("button");
    card.className="card";
    card.dataset.symbol=symbol;
    card.textContent="?";
    card.onclick=()=>flip(card);
    grid.appendChild(card);
  });

  function flip(card){
    if(lock||card.classList.contains("open")||card.classList.contains("matched"))return;

    card.classList.add("open");
    card.textContent=card.dataset.symbol;

    if(!first){
      first=card;
      return;
    }

    second=card;
    moves++;

    if(first.dataset.symbol===second.dataset.symbol){
      first.classList.add("matched");
      second.classList.add("matched");
      matched++;
      document.getElementById("pairCount").textContent=matched;

      first=null;
      second=null;

      setScore(Math.max(0,1000-(moves*12)+(level*25)));

      if(matched===pairs){
        setTimeout(()=>finishGame(score+level*20),450);
      }

    }else{
      lock=true;

      setTimeout(()=>{
        first.classList.remove("open");
        second.classList.remove("open");
        first.textContent="?";
        second.textContent="?";
        first=null;
        second=null;
        lock=false;
      },650);
    }
  }
}

/* =========================================================
   QUICK REACTION
   ========================================================= */

function initReaction(level){
  const panel=document.getElementById("gamePanel");

  const duration=Math.min(30000,13000+level*650);
  const spawnDelay=Math.max(260,900-level*22);
  const speed=Math.max(2.2,6.5-level*.025);

  let caught=0;
  let target=Math.min(25,7+Math.floor(level/3));
  let running=true;

  panel.innerHTML=
    '<div class="gameHeader">'+
    '<strong>Pop BUBBLES only</strong>'+
    '<span class="score">Hits: <b id="hitCount">0</b>/'+target+'</span>'+
    '</div>'+
    '<div class="message">🟢 Bubble = + score &nbsp; | &nbsp; 🔢 Number = − score</div>'+
    '<div class="reactionArena" id="reactionArena"></div>';

  const arena=document.getElementById("reactionArena");

  function spawn(){
    if(!running)return;

    const isNumber=Math.random()<Math.min(.48,.28+level*.006);
    const el=document.createElement("button");

    el.className=isNumber
      ?"falling number"
      :"falling bubble "+(["","alt","green"][Math.floor(Math.random()*3)]);

    if(isNumber){
      el.textContent=String(Math.floor(Math.random()*90)+10);
    }else{
      el.textContent=["●","◆","✦","●"][Math.floor(Math.random()*4)];
    }

    const x=4+Math.random()*88;
    el.style.left=x+"%";

    const dur=Math.max(2.2,speed+(Math.random()*2));

    el.style.animationDuration=dur+"s";

    el.onclick=(e)=>{
      e.stopPropagation();

      if(isNumber){
        addScore(-Math.max(2,Math.floor(level/3)));
        el.remove();
        return;
      }

      caught++;
      addScore(10+Math.floor(level*.5));
      document.getElementById("hitCount").textContent=caught;
      el.remove();

      if(caught>=target){
        running=false;
        finishGame(score+Math.floor(Math.max(0,10000-(Date.now()%10000))/100));
      }
    };

    el.addEventListener("animationend",()=>el.remove());
    arena.appendChild(el);
  }

  gameTimer=setInterval(spawn,spawnDelay);

  setTimeout(()=>{
    if(running){
      running=false;
      finishGame(score);
    }
  },duration);

  gameCleanup=()=>{
    running=false;
    arena.innerHTML="";
  };
}

function initShift(level){
  const panel=document.getElementById("gamePanel");

  const total=Math.min(20,6+Math.floor(level*.7));
  let round=0;
  let points=0;
  let ruleIndex=0;

  const rules=[
    {name:"COLOR",desc:"Choose the COLOR shown by the word.",type:"color"},
    {name:"SHAPE",desc:"Choose the SHAPE shown by the symbol.",type:"shape"},
    {name:"NUMBER",desc:"Choose the NUMBER value.",type:"number"},
    {name:"OPPOSITE",desc:"Choose the opposite direction.",type:"opposite"}
  ];

  const colors=[
    {label:"RED",value:"🔴"},
    {label:"BLUE",value:"🔵"},
    {label:"GREEN",value:"🟢"},
    {label:"YELLOW",value:"🟡"}
  ];

  function next(){
    if(round>=total){
      finishGame(points);
      return;
    }

    ruleIndex=(ruleIndex+(Math.random()<.25?1:0))%rules.length;
    const rule=rules[ruleIndex];

    const correct=Math.floor(Math.random()*4);
    const options=[];

    for(let i=0;i<4;i++){
      options.push(i);
    }
    options.sort(()=>Math.random()-.5);

    let display="";
    let labels=[];

    if(rule.type==="color"){
      const c=colors[correct];
      display=c.label;
      labels=options.map(i=>colors[i].label);
    }

    if(rule.type==="shape"){
      const shapes=["●","■","▲","◆"];
      display=shapes[correct];
      labels=options.map(i=>shapes[i]);
    }

    if(rule.type==="number"){
      const nums=["2","4","7","9"];
      display=nums[correct];
      labels=options.map(i=>nums[i]);
    }

    if(rule.type==="opposite"){
      const dirs=["↑","→","↓","←"];
      const opposite=[2,3,0,1];
      display=dirs[correct];
      labels=options.map(i=>dirs[opposite[i]]);
    }

    panel.innerHTML=
      '<div class="shiftBox">'+
      '<div class="rule">'+
      '<small>ROUND '+(round+1)+' / '+total+'</small>'+
      '<b>'+rule.name+'</b>'+
      '<div style="color:var(--muted);margin-top:5px">'+rule.desc+'</div>'+
      '</div>'+
      '<div style="font-size:70px;margin:25px 0">'+display+'</div>'+
      '<div class="shiftChoices" id="shiftChoices"></div>'+
      '</div>';

    const box=document.getElementById("shiftChoices");

    labels.forEach((label,idx)=>{
      const b=document.createElement("button");
      b.className="shiftChoice";
      b.textContent=label;

      b.onclick=()=>{
        const selected=options[idx];

        if(selected===correct){
          points+=15+level*2;
          setScore(points);
          round++;
          setTimeout(next,120);
        }else{
          points=Math.max(0,points-8);
          setScore(points);
          round++;
          setTimeout(next,250);
        }
      };

      box.appendChild(b);
    });
  }

  next();
}

function getLogicQuestion(level,index){
  /*
   Long-term system:
   Higher levels use more questions and transform difficulty
   through ordering, time pressure and question selection.
  */
  const seed=(level*17+index*31)%LOGIC_BANK.length;
  return LOGIC_BANK[seed];
}

function initLogic(level){
  const panel=document.getElementById("gamePanel");

  const total=Math.min(
    12,
    5+Math.floor(level/8)
  );

  let qIndex=0;
  let points=0;
  let correct=0;

  function showQuestion(){
    if(qIndex>=total){
      finishGame(points);
      return;
    }

    const q=getLogicQuestion(level,qIndex);

    panel.innerHTML=
      '<div class="logicBox">'+
      '<div class="gameHeader">'+
      '<strong>Logic Lab</strong>'+
      '<span class="score">'+(qIndex+1)+' / '+total+'</span>'+
      '</div>'+
      '<div class="progress"><i style="width:'+((qIndex/total)*100)+'%"></i></div>'+
      '<div class="question">'+
      '<b>'+q.q+'</b>'+
      '<div style="margin-top:10px;color:var(--muted);font-size:14px">'+q.en+'</div>'+
      '</div>'+
      '<div class="options" id="logicOptions"></div>'+
      '</div>';

    const opts=document.getElementById("logicOptions");

    q.opts.forEach((text,i)=>{
      const b=document.createElement("button");
      b.className="logicOption";
      b.textContent=text;

      b.onclick=()=>{
        opts.querySelectorAll("button").forEach(x=>x.disabled=true);

        if(i===q.a){
          correct++;
          points+=20+level;
          setScore(points);
        }else{
          points=Math.max(0,points-5);
          setScore(points);
        }

        const exp=document.createElement("div");
        exp.className="explain";
        exp.textContent=
          i===q.a
          ?"Correct reasoning. Continue to the next challenge."
          :"Check the stated rule carefully and compare every option.";

        opts.parentNode.appendChild(exp);

        qIndex++;
        setTimeout(showQuestion,650);
      };

      opts.appendChild(b);
    });
  }

  showQuestion();
}

/* =========================================================
   MIND CALM
   ========================================================= */

function initCalm(level){
  const panel=document.getElementById("gamePanel");

  const duration=Math.min(
    180,
    35+level*5
  );

  let remaining=duration;
  let running=false;

  panel.innerHTML=
    '<div class="calmBox">'+
    '<div class="gameHeader">'+
    '<strong>Mind Calm</strong>'+
    '<span class="score"><span id="calmTime">'+remaining+'</span>s</span>'+
    '</div>'+
    '<div class="breathCircle" id="breathCircle">'+
    '<span id="breathText">Ready</span>'+
    '</div>'+
    '<div class="calmText" id="calmMain">Slow down.</div>'+
    '<div class="calmSub">Follow the circle. Breathe slowly. Keep your attention on the present moment.</div>'+
    '<div class="calmButtons">'+
    '<button class="primary" id="calmStart">Start Session</button>'+
    '<button class="secondary" id="calmFinish">Finish</button>'+
    '</div>'+
    '</div>';

  const circle=document.getElementById("breathCircle");
  const text=document.getElementById("breathText");
  const main=document.getElementById("calmMain");
  const time=document.getElementById("calmTime");

  document.getElementById("calmStart").onclick=()=>{
    if(running)return;

    running=true;
    circle.classList.add("animate");

    let phase=0;

    gameTimer=setInterval(()=>{
      remaining--;
      time.textContent=remaining;

      phase=(phase+1)%8;

      if(phase<4){
        text.textContent="Breathe in";
        main.textContent="Breathe in slowly";
      }else{
        text.textContent="Breathe out";
        main.textContent="Breathe out slowly";
      }

      if(remaining<=0){
        finishGame(100+level*10);
      }
    },1000);
  };

  document.getElementById("calmFinish").onclick=()=>{
    if(running){
      const completed=duration-remaining;
      finishGame(Math.max(20,completed*3));
    }else{
      finishGame(10);
    }
  };

  gameCleanup=()=>{
    circle.classList.remove("animate");
  };
}
